spring.application.name=SupplyChainX
server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework=INFO
logging.level.com.supplychainx=DEBUG
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/supplyChainX?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Configuration
app.jwtSecret=mySecretKey123456789012345678901234567890123456789012345678901234567890
app.jwtExpirationInMs=86400000
header.jwtHeader=Authorization
token.prefix=Bearer