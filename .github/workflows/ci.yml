name: SupplyChainX CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1) Checkout du code
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2) Setup JDK 17
      # -------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # -------------------------------------------------------
      # 3) Cache Maven
      # -------------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # -------------------------------------------------------
      # 4) Build + Tests + JaCoCo
      # -------------------------------------------------------
      - name: Build & Run Unit + Integration Tests
        run: mvn --batch-mode clean verify

      # -------------------------------------------------------
      # 5) Upload JaCoCo report
      # -------------------------------------------------------
      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      # -------------------------------------------------------
      # 6) SonarQube Analysis
      # -------------------------------------------------------
      - name: SonarQube Scan
        run: mvn sonar:sonar \
          -Dsonar.projectKey=SupplyChainX \
          -Dsonar.host.url=${{ secrets.SONAR_HOST }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

      # -------------------------------------------------------
      # 7) Build Docker Image
      # -------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build -t supplychainx-backend .

      # -------------------------------------------------------
      # 8) Save Docker Image (optional)
      # -------------------------------------------------------
      - name: Save Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: supplychainx-docker-image
          path: .
