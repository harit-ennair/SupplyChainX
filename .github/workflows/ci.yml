name: SupplyChainX CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1) Checkout du code
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2) Setup JDK 17
      # -------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # -------------------------------------------------------
      # 3) Cache Maven
      # -------------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # -------------------------------------------------------
      # 4) Build + Tests + JaCoCo
      # -------------------------------------------------------
      - name: Build & Run Unit + Integration Tests
        run: mvn --batch-mode clean verify

      # -------------------------------------------------------
      # 5) Upload JaCoCo report
      # -------------------------------------------------------
      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      # -------------------------------------------------------
      # 6) SonarQube Analysis
      # -------------------------------------------------------
      - name: SonarQube Scan
        run: |
          echo "Checking Sonar host reachability: ${SONAR_HOST_URL}"
          if curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/server/version" -m 10 > /dev/null 2>&1; then
            echo "Sonar reachable — running analysis..."
            ./mvnw -B sonar:sonar \
              -Dsonar.host.url=${SONAR_HOST} \
              -Dsonar.token=${SONAR_TOKEN}
            echo "Sonar analysis completed."
          else
            echo "Sonar not reachable from this runner. Skipping Sonar analysis."
          fi

  build-and-push:
    name: Build JAR and Push Docker image
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Make mvnw executable
        run: chmod +x mvnw || true

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build package (no tests, already ran)
        run: ./mvnw -B -DskipTests -DskipITs clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USER }}/supplychainx-api:${{ github.sha }}
            ${{ secrets.DOCKER_USER }}/supplychainx-api:latest

      - name: Upload image metadata
        uses: actions/upload-artifact@v4
        with:
          name: image-info
          path: target
